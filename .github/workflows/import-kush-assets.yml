name: Import verified approved Kush Krusher assets
on:
  push:
    branches: [feature/mb3-kush-animation-destruction]
    paths:
      - '.github/workflows/import-kush-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-approved-frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch pinned public canonical assets
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/abvhiael/420-integrated-v0.1.git /tmp/420source
          git -C /tmp/420source sparse-checkout init --cone
          git -C /tmp/420source sparse-checkout set assets/arcade/mad-buds/kush-krusher/animations
          git -C /tmp/420source checkout d539720de90a78523470b4c210a773ba18119e70
          mkdir -p assets/characters/kush-krusher/animations
          cp -a /tmp/420source/assets/arcade/mad-buds/kush-krusher/animations/. assets/characters/kush-krusher/animations/
      - name: Verify every approved frame and manifest against pinned source
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path("assets/characters/kush-krusher/animations")
          manifests=sorted(root.glob("kk_anim_*/*.json"))
          assert len(manifests)==15, f"expected 15 manifests, got {len(manifests)}"
          errors=[]
          found=set()
          for p in manifests:
              d=json.loads(p.read_text())
              get=lambda a,b: d.get(a,d.get(b))
              if get("characterId","character_id")!="kush_krusher": errors.append(f"{p}: character identity")
              if get("frameCount","frame_count")!=10: errors.append(f"{p}: count")
              if get("frameWidth","frame_width")!=1024 or get("frameHeight","frame_height")!=1024: errors.append(f"{p}: dimensions")
              fps=d.get("fps")
              if fps is not None and fps!=10: errors.append(f"{p}: FPS differs from canonical 10")
              if fps is None and d.get("playbackTimingStatus")!="NOT_SPECIFIED_OR_VERIFIED": errors.append(f"{p}: missing timing without explicit deferred marker")
              frames=d.get("frames",[])
              if len(frames)!=10: errors.append(f"{p}: frames count {len(frames)}")
              for i,frame in enumerate(frames,1):
                  idx=frame.get("index",frame.get("frame_number",i))
                  if idx!=i: errors.append(f"{p}: frame order {i}")
                  ms=frame.get("durationMs",frame.get("duration_ms",d.get("frame_duration_ms",d.get("frameDurationMs"))))
                  if ms is not None and ms!=100: errors.append(f"{p}: frame {i} timing {ms}")
                  if ms is None and d.get("playbackTimingStatus")!="NOT_SPECIFIED_OR_VERIFIED": errors.append(f"{p}: missing frame duration {i}")
                  name=frame.get("filename",frame.get("file"))
                  expected=f"kush_krusher_anim_{p.parent.name[8:]}_frame_{i:02d}.png"
                  if name!=expected: errors.append(f"{p}: wrong file/order {i}: {name}")
                  fp=p.parent/(name or "")
                  if not fp.is_file(): errors.append(f"{p}: missing {name}"); continue
                  digest=hashlib.sha256(fp.read_bytes()).hexdigest()
                  if digest!=frame.get("sha256"): errors.append(f"{fp}: checksum mismatch")
                  if fp.read_bytes()[:8]!=bytes.fromhex("89504e470d0a1a0a"): errors.append(f"{fp}: not a PNG")
                  found.add(fp)
          actual=set(root.glob("kk_anim_*/*.png"))
          if len(found)!=150 or actual!=found: errors.append(f"expected exact 150 files, found {len(found)} verified filenames and {len(actual)} actual")
          if errors: raise AssertionError("\\n".join(errors))
          print("PASS: 15 manifests, 150 exact SHA-256 PNGs; canonical 10 FPS adapter for source 05 unspecified timing")
          PY
      - name: Commit unchanged qualified source assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/kush-krusher/animations
          if ! git diff --cached --quiet; then
            git commit -m "assets: import all 15 pinned Kush Krusher animations with verified PNG checksums"
            git fetch origin feature/mb3-kush-animation-destruction
            git rebase origin/feature/mb3-kush-animation-destruction
            git push origin HEAD:feature/mb3-kush-animation-destruction
          fi
